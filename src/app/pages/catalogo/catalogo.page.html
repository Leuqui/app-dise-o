<ion-header class="ion-no-border">
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button defaultHref="/tabs/inicio" text="" icon="chevron-back-outline"></ion-back-button>
        </ion-buttons>
        <ion-title class="titulo">Catálogo</ion-title>
        <ion-buttons slot="end">
            <ion-button>
                <ion-icon slot="icon-only" name="search-outline"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    <!-- Buscador -->
    <div class="buscador">
        <ion-icon name="search-outline"></ion-icon>
        <input type="text" placeholder="Buscar muebles..." [(ngModel)]="texto" />
    </div>

    <!-- Categorías -->
    <div class="categorias">
        <button *ngFor="let c of categorias" class="chip" [class.activo]="c === categoria" (click)="categoria = c">
      {{ c }}
    </button>
    </div>

    <!-- Productos -->
    <div class="grid">
        <div class="producto" *ngFor="let p of filtrados()">
            <div class="img-box" (click)="irDetalle()">
                <img [src]="p.img" [alt]="p.nombre" />
            </div>
            <div class="info">

                <div>
                    <p class="nombre">{{ p.nombre }}</p>
                    <p class="precio">
                        {{ p.precio | currency:'USD':'symbol':'1.2-2' }}
                    </p>
                </div>

                <div class="acciones">

                    <!-- Favoritos -->
                    <ion-icon [name]="p.fav ? 'heart' : 'heart-outline'" (click)="p.fav = !p.fav">
                    </ion-icon>

                    <!-- Agregar al carrito -->
                    <ion-icon [name]="carrito.estaEnCarrito(p.id) ? 'cart' : 'cart-outline'" [class.agregado]="carrito.estaEnCarrito(p.id)" (click)="agregarAlCarrito(p)">
                    </ion-icon>
                </div>

            </div>
        </div>
    </div>
</ion-content>

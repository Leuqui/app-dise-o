<ion-tabs>

    <ion-tab-bar slot="bottom" class="barra">

        <!-- Inicio -->
        <ion-tab-button tab="inicio" href="/tabs/inicio">
            <ion-icon name="home-outline"></ion-icon>
            <ion-label>Inicio</ion-label>
        </ion-tab-button>

        <!-- Catálogo -->
        <ion-tab-button tab="catalogo" href="/tabs/catalogo">
            <ion-icon name="albums-outline"></ion-icon>
            <ion-label>Catálogo</ion-label>
        </ion-tab-button>

        <!-- Botón central 3D -->
        <ion-tab-button tab="3d" (click)="ir3D($event)">
            <div class="btn-3d">
                <div class="circulo">3D</div>
            </div>
        </ion-tab-button>

        <!-- Carrito -->
        <ion-tab-button tab="carrito" href="/tabs/carrito">
            <ion-icon name="cart-outline"></ion-icon>
            <ion-label>Carrito</ion-label>
        </ion-tab-button>

        <!-- Favoritos -->
        <ion-tab-button tab="favoritos" href="/tabs/favoritos">
            <ion-icon name="heart-outline"></ion-icon>
            <ion-label>Favoritos</ion-label>
        </ion-tab-button>

        <!-- Perfil -->
        <ion-tab-button tab="perfil" href="/tabs/perfil">
            <ion-icon name="person-outline"></ion-icon>
            <ion-label>Perfil</ion-label>
        </ion-tab-button>

    </ion-tab-bar>

</ion-tabs>

<ion-content [fullscreen]="true" [scrollY]="false" class="login-content">
    <div class="login-card">
        <button type="button" class="back-btn" aria-label="Volver" (click)="goBack()">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>

        <h1 class="title">¡Bienvenido!</h1>
        <p class="subtitle">Inicia sesión para continuar</p>

        <!-- Social -->
        <button type="button" class="social-btn" [disabled]="loading" (click)="loginGoogle()">
      <svg class="social-icon" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
        <path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3.1-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/>
        <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
      </svg>
      <span>Continuar con Google</span>
    </button>

        <button type="button" class="social-btn" [disabled]="loading" (click)="loginApple()">
      <svg class="social-icon" viewBox="0 0 384 512" aria-hidden="true">
        <path fill="currentColor" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
      </svg>
      <span>Continuar con Apple</span>
    </button>

        <!-- Separador -->
        <div class="divider"><span>o</span></div>

        <!-- Formulario -->
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="field" [class.invalid]="showError('email')">
                <input type="email" formControlName="email" placeholder="Correo electrónico" autocomplete="email" inputmode="email" />
            </div>
            @if (showError('email')) {
            <p class="error">Ingresa un correo válido</p>
            }

            <div class="field" [class.invalid]="showError('password')">
                <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Contraseña" autocomplete="current-password" />
                <button type="button" class="eye-btn" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'" (click)="showPassword = !showPassword">
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
            </div>
            @if (showError('password')) {
            <p class="error">La contraseña debe tener al menos 6 caracteres</p>
            } @if (errorMsg) {
            <p class="error center">{{ errorMsg }}</p>
            }

            <a class="forgot" (click)="goForgot()">¿Olvidaste tu contraseña?</a>

            <button type="submit" class="primary-btn" [disabled]="loading">
        @if (loading) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Iniciar sesión
        }
      </button>
        </form>

        <p class="register">
            ¿No tienes cuenta?
            <a (click)="goRegister()">Regístrate</a>
        </p>
    </div>
</ion-content>

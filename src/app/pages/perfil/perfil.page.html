<ion-content [fullscreen]="true">

  <section class="hero">

    <img
      class="avatar"
      src="assets/ana.jpg"
      alt="Foto de perfil de Ana García"
    />

    <div class="user-info">
      <h2>Ana García</h2>
      <p>ana.garcia&#64;email.com</p>
    </div>

  </section>

  <section class="sheet">

    <nav class="menu">

      @for (item of menu; track item.label) {

        <button type="button" class="item">

          <ion-icon
            [name]="item.icon"
            class="lead">
          </ion-icon>

          <span>{{ item.label }}</span>

          <ion-icon
            name="chevron-forward"
            class="chev">
          </ion-icon>

        </button>

      }

    </nav>

    <button
      type="button"
      class="logout"
      (click)="logout()">

      Cerrar sesión

    </button>

  </section>

</ion-content>

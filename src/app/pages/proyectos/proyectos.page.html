<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio" text=""></ion-back-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon slot="icon-only" name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="head">
    <h2>Mis proyectos</h2>
    <button class="new">+ Nuevo</button>
  </div>

  @for (p of projects; track p.name) {
    <article class="card">
      <img [src]="p.img" [alt]="p.name" />
      <div class="info">
        <strong>{{ p.name }}</strong>
        <small>{{ p.edited }}</small>
      </div>
    </article>
  }
</ion-content>
